name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements/lint.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements/lint.txt

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - name: Prepare lightweight development tools
        run: |
          uv venv --python 3.14
          uv pip install --python .venv/bin/python -r requirements/lint.txt PyYAML regex
          .venv/bin/pre-commit install
      - name: Validate the agent development environment
        run: .venv/bin/python tools/pre_commit/check_agent_files.py
