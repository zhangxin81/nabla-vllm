name: pre-commit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - name: Install lint tools
        run: |
          uv venv --python 3.14
          uv pip install --python .venv/bin/python -r requirements/lint.txt
          .venv/bin/pre-commit install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Check changed files
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git rev-parse --verify "$BASE_REF^{commit}" >/dev/null 2>&1; then
            BASE_REF=$(git rev-parse HEAD^)
          fi
          .venv/bin/pre-commit run --show-diff-on-failure --hook-stage manual \
            --from-ref "$BASE_REF" --to-ref HEAD
