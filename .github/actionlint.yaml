# Custom self-hosted runner labels retained by upstream workflows.
self-hosted-runner:
  labels:
    - vllm-runners
    - macos-26
    - ubuntu-slim

# Generated gh-aw syntax newer than actionlint v1.7.12 is checked by gh-aw.
paths:
  .github/workflows/agent-*.lock.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\.'
      - '^unexpected key "cache-mode" for "job" section\.'
      - '^property "workflow_(ref|sha)" is not defined in object type '
